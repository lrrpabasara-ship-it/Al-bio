<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;--bg:#f4f6f8;--card:#fff;--tx:#17202a;--mu:#5f6b76;--bd:#dde3e8;--ac:#0f766e;--P:#1d4ed8;--C:#b45309;--B:#15803d}

:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1519;--card:#18222a;--tx:#e8eef2;--mu:#93a1ad;--bd:#2a3742;--ac:#2dd4bf;--P:#7aa7ff;--C:#fbbf5c;--B:#4ade80}

body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:14px 10px 40px}
h1{font-size:22px;margin:0 0 2px}
.sub{color:var(--mu);font-size:13px}
.bar{height:8px;background:var(--bd);border-radius:4px;margin:10px 0 4px;overflow:hidden}

nav{display:flex;align-items:center;gap:8px;margin:14px 0 8px}

button{font:inherit;color:inherit;cursor:pointer}

.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;font-size:12px;color:var(--mu);padding:2px 0}
.cell{min-height:64px;background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:3px;text-align:left;display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden}
.cell.off{background:transparent;border-style:dashed;opacity:.35;cursor:default}
.cell.sel{outline:2px solid var(--ac)}
.cell.now .n{background:var(--ac);color:var(--bg);border-radius:9px;padding:0 5px}
.cell.full{background:color-mix(in srgb,var(--ac) 16%,var(--card))}
.n{font-size:12px;font-weight:600;align-self:flex-start}

.ch{display:flex;flex-wrap:wrap;gap:2px}
.ch span{font-size:9.5px;font-weight:600;line-height:1.3;padding:0 3px;border-radius:3px;color:var(--c,var(--mu));background:color-mix(in srgb,var(--c,var(--mu)) 18%,transparent)}
.P{--c:var(--P)}.C{--c:var(--C)}.B{--c:var(--B)}
#panel{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-top:14px}

.task{display:flex;gap:10px;align-items:flex-start;padding:9px 8px;margin-top:8px;border:1px solid var(--bd);border-left:4px solid var(--c,var(--bd));border-radius:6px;cursor:pointer}
.task input{width:20px;height:20px;margin:2px 0 0;flex:none;accent-color:var(--ac)}
.task div{flex:1;min-width:0}
.task b{display:block;font-size:14.5px}
.task span{display:block;color:var(--mu);font-size:13px}
.task em{font-style:normal;font-size:12px;color:var(--mu);white-space:nowrap}
.task:has(input:checked){opacity:.55}
.task:has(input:checked) b{text-decoration:line-through}
.leg{font-size:12px;color:var(--mu);margin-top:12px}
:root{--bg:#fff3f9;--card:#fffafd;--tx:#4a2c46;--mu:#8f6a88;--bd:#f7cfe3;--ac:#e8508f;--P:#7a4de0;--C:#e2603a;--B:#0e9f78}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1224;--card:#2a1a33;--tx:#fdeaf6;--mu:#cba9c6;--bd:#503060;--ac:#ff80bd;--P:#bda6ff;--C:#ffb18d;--B:#6ee7c3}}
:root[data-theme="dark"]{--bg:#1e1224;--card:#2a1a33;--tx:#fdeaf6;--mu:#cba9c6;--bd:#503060;--ac:#ff80bd;--P:#bda6ff;--C:#ffb18d;--B:#6ee7c3}
body{font-family:"Quicksand",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:500;background:radial-gradient(circle at 15% 0%,color-mix(in srgb,var(--ac) 14%,transparent),transparent 45%),radial-gradient(circle at 90% 30%,color-mix(in srgb,var(--P) 12%,transparent),transparent 40%),var(--bg);background-attachment:fixed}
main{position:relative;z-index:1}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#fx span{position:absolute;bottom:-40px;opacity:.4;animation:rise linear infinite}
@keyframes rise{from{transform:translate(0,0) rotate(0)}50%{transform:translate(18px,-55vh) rotate(20deg)}to{transform:translate(-10px,-115vh) rotate(40deg)}}
.top{display:flex;align-items:center;gap:8px}
h1{font-family:"Pacifico","Brush Script MT",cursive;font-weight:400;font-size:28px;background:linear-gradient(90deg,var(--ac),var(--P),var(--ac));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}

.bow{display:inline-block;font-size:26px;transform-origin:50% 80%;animation:wig 2.4s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(12deg) scale(1.1)}}
.mot{display:inline-block;margin:8px 0 2px;padding:6px 12px;border-radius:999px;background:color-mix(in srgb,var(--ac) 14%,var(--card));font-size:13px;font-weight:700;color:var(--ac);animation:flt 3s ease-in-out infinite}
@keyframes flt{50%{transform:translateY(-3px)}}
.bar{height:12px;border-radius:999px;background:color-mix(in srgb,var(--ac) 15%,var(--card))}
.bar i{border-radius:999px;background:linear-gradient(90deg,#ff9ccb,var(--ac),#b69cff,#ff9ccb);background-size:200% 100%;animation:shine 2.5s linear infinite;transition:width .8s cubic-bezier(.3,1.4,.5,1)}
nav button{border-radius:999px;transition:transform .15s,background .2s}

nav b{font-family:"Pacifico",cursive;font-weight:400;color:var(--ac)}
.cell{border-radius:14px;transition:transform .18s cubic-bezier(.3,1.6,.5,1),box-shadow .2s}
button.cell:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 6px 14px color-mix(in srgb,var(--ac) 25%,transparent)}

.cell.sel{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.8)}100%{transform:scale(1)}}
.cell.now{animation:glow 2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 30%,transparent)}}
.cell.now .n{border-radius:999px}
.cell.full{background:color-mix(in srgb,var(--ac) 18%,var(--card))}
.cell.full::after{content:"💖";position:absolute;right:3px;top:1px;font-size:11px;animation:beat 1.2s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.3)}}
.cell s{height:4px;background:linear-gradient(90deg,#ff9ccb,var(--ac));transition:width .5s}
#cal.swap{animation:slide .4s ease}
@keyframes slide{from{opacity:0;transform:translateX(18px)}}
.ch span{border-radius:999px;padding:0 5px}
#panel{border-radius:22px;border:2px solid var(--bd);box-shadow:0 10px 30px color-mix(in srgb,var(--ac) 14%,transparent)}
#panel h2{font-family:"Pacifico",cursive;font-weight:400;color:var(--ac);font-size:19px}
.task{border-radius:16px;border-left:5px solid var(--c,var(--bd));transition:transform .15s,opacity .3s,background .3s}
.task:active{transform:scale(.97)}
.task:has(input:checked){background:color-mix(in srgb,var(--ac) 10%,var(--card))}
.task input{appearance:none;-webkit-appearance:none;width:24px;height:24px;border:2px solid var(--ac);border-radius:50%;display:grid;place-content:center;background:var(--card);transition:background .2s}
.task input:checked{background:var(--ac);animation:pop .4s cubic-bezier(.3,1.8,.5,1)}
.task input:checked::after{content:"♥";color:#fff;font-size:13px;line-height:1}
.task input:focus-visible{outline:3px solid color-mix(in srgb,var(--ac) 45%,transparent);outline-offset:2px}
#panel.enter .task{animation:up .5s cubic-bezier(.2,1.2,.4,1) both;animation-delay:var(--d,0ms)}
@keyframes up{from{opacity:0;transform:translateY(16px) scale(.96)}}
.yay{margin:10px 0 0;padding:8px 12px;border-radius:14px;text-align:center;font-weight:700;color:#fff;background:linear-gradient(90deg,#d63384,#8b5cf6,#d63384);background-size:200% 100%;animation:shine 3s linear infinite,pop .5s}
.bu,.cf{position:fixed;pointer-events:none;z-index:50}
.bu{animation:bu .9s ease-out forwards}
@keyframes bu{from{transform:translate(-50%,-50%) scale(1)}to{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(.4);opacity:0}}
.cf{top:-30px;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#fx,.bu,.cf{display:none}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Pacifico&display=swap"></head>
<body><div id="fx" aria-hidden="true"></div><main>
<div class="top"><span class="bow">🎀</span><h1>A/L Study Calendar</h1></div>
<div class="sub">Physics, Chemistry and Biology · 26 Oct 2026 to 25 Apr 2027 · 9 hours a day</div>
<div class="bar"><i id="pb"></i></div><div class="sub" id="pt"></div><div class="mot" id="mot"></div>
<nav><button id="pv" aria-label="Previous month">‹</button><b id="mt"></b><button id="nx" aria-label="Next month">›</button><button id="td">Today</button></nav>
<div class="grid" id="hd"></div><div class="grid" id="cal"></div>
<section id="panel"></section>
<p class="leg">P = Physics, C = Chemistry, B = Biology, the number is the unit. Ticks are saved on this device. Mark questions ✓ easy, △ struggled, ✗ failed, and put every △ and ✗ in your Error Notebook.</p>
</main>
<script>
const S={
P:{n:'Physics',u:[['Measurement',5],['Mechanics',16],['Oscillations and waves',9],['Thermal physics',7],['Gravitational field',5],['Electric field',10],['Magnetic field',8],['Current electricity',10],['Electronics',10],['Mechanical properties of matter',8],['Matter and radiation',8]]},
C:{n:'Chemistry',u:[['Atomic structure',5],['Structure and bonding',7],['Chemical calculations',9],['Gaseous state of matter',5],['Energetics',7],['Chemistry of s, p and d block elements',11],['Basic concepts of organic chemistry',6],['Hydrocarbons and halohydrocarbons',7],['Oxygen containing organic compounds',9],['Nitrogen containing organic compounds',6],['Chemical kinetics',6],['Equilibrium',8],['Electrochemistry',6],['Industrial chemistry and environmental pollution',4]]},
B:{n:'Biology',u:[['Introduction to Biology · ජීව විද්‍යාව හඳුන්වාදීම',4],['Chemical and Cellular Basis of Life · ජීවයේ රසායනික හා සෛලීය පදනම',14],['Evolution and Biodiversity · පරිණාමය හා ජෛව විවිධත්වය',12],['Plant Form and Function · ශාක ආකාරය හා ක්‍රියාකාරීත්වය',14],['Animal Form and Function · සත්ත්ව ආකාරය හා ක්‍රියාකාරීත්වය',18],['Applied Biology · ව්‍යාවහාරික ජීව විද්‍යාව',6],['Genetics · ප්‍රවේණිය',10],['Microbiology · ක්ෂුද්‍ර ජීව විද්‍යාව',8],['Molecular Biology · අනුක ජීව විද්‍යාව',6],['Environmental Biology · පාරිසරික ජීව විද්‍යාව',4]]}};
const N=182,ST=new Date(2026,9,26),DAY=864e5,nm=x=>x.split(' · ')[0];
const fh=h=>h>=1?(+h.toFixed(1))+' h':Math.round(h*60)+' min';
const FP={},ALL=[];
for(const s in S){FP[s]=[];S[s].u.forEach((u,i)=>{ALL.push([s,i]);for(let x=1;x<=u[1];x++)FP[s].push([i,x,u[1]])})}
const plan=[];let k=0;
for(let i=0;i<N;i++){const d=new Date(2026,9,26+i),dow=(d.getDay()+6)%7;plan.push({d,i,dow,w:Math.floor(i/7)+1,sun:dow==6,k:dow==6?-1:k++})}
const rev={};
plan.forEach(p=>{if(p.k>=0&&p.k<96)for(const s in S){const f=FP[s][p.k];if(f[1]==f[2])[1,3,7,14,30,60].forEach(o=>{let j=p.i+o;if(j<N&&plan[j].sun)j++;if(j<N)(rev[j]=rev[j]||[]).push([s+(f[0]+1),`Review ${s}${f[0]+1} ${nm(S[s].u[f[0]][0])}, day ${o}`+(o==7?', then write a one-page summary':'')])})}});
function tasks(p){
const T=[],i=p.i,t=(a,b,h,c=[])=>T.push({t:a,d:b,h,c});
if(i==N-1){t('Last day: light revision','Read your one-page summaries and Error Notebook lightly. Pack your things and sleep early.',3);return T}
if(p.sun){t('Timed mixed test (Physics, Chemistry, Biology)','2 to 3 h in exam conditions, on the last 2 weeks of work.',3);t('Mark it and update the Error Notebook','Use the official marking schemes. For each △ and ✗ write the page, why you failed and the key idea that unlocks it.',1.5);t('Read the whole Error Notebook','Then rest for the rest of the day.',.5);return T}
const lastTwo=(s,u,x,n,txt)=>t(`${s}${u+1} ${S[s].u[u][0]}`+(x?` · day ${x} of ${n}`:''),txt,2.5,[s+(u+1)]);
if(p.k<96)['B','P','C'].forEach(s=>{const[u,x,n]=FP[s][p.k];lastTwo(s,u,x,n,(x==1?'New unit: skim your notes, then learn in small parts. ':'Recall yesterday first (10 min). ')+'Learn about 1 h, then 1.5 h of questions from easy to hard. Mark ✓ △ ✗.'+(x==n?' Last day of this unit: finish its past-paper questions.':''))});
else if(p.k<126)['B','P','C'].forEach(s=>{const u=Math.floor((p.k-96)*S[s].u.length/30);lastTwo(s,u,0,0,'Second pass: redo every △ and ✗ from the Error Notebook, then 8 to 10 new past-paper questions (recent years first).')});
else if(p.k<144){
if(p.dow<3){const s='PCB'[p.dow];t(S[s].n+' full timed paper','3 h, exam conditions, no notes.',3,[s]);t('Mark with the official scheme','Write every mistake in the Error Notebook.',1.5,[s]);t('Redo your weakest '+S[s].n+' units','Use the △ and ✗ list from your Error Notebook.',3,[s])}
else if(p.dow==4){t('Timed paper on your weakest subject','3 h, exam conditions.',3);t('Mark it','Official marking scheme, then Error Notebook.',1.5);t('Redo weakest units from any subject','Pick them from the Error Notebook.',3)}
else['B','P','C'].forEach(s=>t('Weakest '+S[s].n+' units','Redo them from the Error Notebook, then past-paper questions on them.',2.5,[s]))}
else{const q=p.k-144,a=[0,1,2].map(z=>ALL[(q*3+z)%ALL.length]);
t('One-page summaries: '+a.map(([s,u])=>nm(S[s].u[u][0])).join(', '),'Read each page, close it, then write the key points from memory. No new content now.',3,a.map(([s,u])=>s+(u+1)));
t('Read the Error Notebook','Focus on repeated mistakes.',1.5);
if(q%2==0){const s='PCB'[(q/2|0)%3];t(S[s].n+' timed paper','3 h, then mark it straight away.',3,[s])}else t('Past-paper questions on your weakest units','Any subject.',3)}
const rv=rev[i]||[];
if(rv.length)rv.forEach(r=>t(r[1],'Close the notes, write what you remember, then redo 3 to 5 △ and ✗ questions (15 to 20 min).',1/rv.length,[r[0]]));
else t('Extra questions',i==0?'Setup (30 min): get a notebook for your Error Notebook and a page listing all 35 units with 6 small boxes each. Then 30 min of extra questions on today’s topics.':'Nothing is due for review. Use this hour for more questions on today’s topics.',1);
t('Before bed: 5 lines','Write 5 lines about what you learned today and update the Error Notebook.',.5);
return T}
const TK=plan.map(tasks),TT=TK.reduce((a,b)=>a+b.length,0);
let done={};try{done=JSON.parse(localStorage.getItem('alplan-v1')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('alplan-v1',JSON.stringify(done))}catch(e){}};
const now=new Date(),dayIdx=d=>Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-ST)/DAY);
const td=Math.max(0,Math.min(N-1,dayIdx(now))),ym=d=>d.getFullYear()*12+d.getMonth();
let lastSel=-1,sel=td,mon=ym(plan[td].d);
const M0=ym(plan[0].d),M1=ym(plan[N-1].d),$=id=>document.getElementById(id);
const MOT=['You’ve got this! 💕','Small steps every day add up ✨','Be proud of how far you’ve come 🌸','Rest is part of the plan too 🦋','Future you says thank you 💖','One topic at a time, beautiful 🎀','Believe in yourself, you’re doing great 🌷'];const phase=w=>w<=16?'First pass':w<=21?'Second pass':w<=24?'Full timed papers':'Final sweep';
$('hd').innerHTML=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="wd">${x}</div>`).join('');
function render(){
const first=new Date(Math.floor(mon/12),mon%12,1),lead=(first.getDay()+6)%7,days=new Date(first.getFullYear(),first.getMonth()+1,0).getDate();
$('mt').textContent=first.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
let h='';for(let z=0;z<lead;z++)h+='<div></div>';
for(let day=1;day<=days;day++){const i=dayIdx(new Date(first.getFullYear(),first.getMonth(),day));
if(i<0||i>=N){h+=`<div class="cell off"><span class="n">${day}</span></div>`;continue}
const tk=TK[i],dn=tk.filter((_,j)=>done[i+'|'+j]).length;
let c=[...new Set(tk.flatMap(x=>x.c))].slice(0,3).map(x=>`<span class="${x[0]}">${x}</span>`).join('');
if(!c)c=`<span>${plan[i].sun?'Test':'Last'}</span>`;
h+=`<button class="cell${i==sel?' sel':''}${i==td?' now':''}${dn==tk.length?' full':''}" data-i="${i}"><span class="n">${day}</span><div class="ch">${c}</div><s style="width:${dn/tk.length*100}%"></s></button>`}
$('cal').innerHTML=h;
const p=plan[sel],tk=TK[sel],tot=tk.reduce((a,b)=>a+b.h,0),dn=tk.filter((_,j)=>done[sel+'|'+j]).length;
$('panel').innerHTML=`<h2>${p.d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</h2><div class="sub">Week ${p.w} · ${phase(p.w)} · ${fh(tot)} planned · ${dn} of ${tk.length} done</div>`+(dn==tk.length?'<div class="yay">All done for today! You’re amazing 💖</div>':'')+tk.map((x,j)=>`<label class="task ${x.c[0]?x.c[0][0]:''}" style="--d:${j*45}ms"><input type="checkbox" data-j="${j}"${done[sel+'|'+j]?' checked':''}><div><b>${x.t}</b><span>${x.d}</span></div><em>${fh(x.h)}</em></label>`).join('');
$('panel').classList.toggle('enter',sel!==lastSel);lastSel=sel;const all=Object.keys(done).length;
$('pb').style.width=all/TT*100+'%';$('mot').textContent=MOT[sel%MOT.length];$('pt').textContent=`${all} of ${TT} tasks done (${Math.round(all/TT*100)}%)`;
$('pv').disabled=mon<=M0;$('nx').disabled=mon>=M1}
$('cal').onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;sel=+b.dataset.i;render();$('panel').scrollIntoView({behavior:'smooth',block:'start'})};
$('panel').onchange=e=>{const j=e.target.dataset.j;if(j==null)return;const k=sel+'|'+j;e.target.checked?(done[k]=1,burst(e.target)):delete done[k];save();render();if(e.target.checked&&TK[sel].every((_,z)=>done[sel+'|'+z]))celebrate()};
const swap=()=>{const c=$('cal');c.classList.remove('swap');void c.offsetWidth;c.classList.add('swap')};
$('pv').onclick=()=>{mon--;render();swap()};$('nx').onclick=()=>{mon++;render();swap()};
function burst(el){const r=el.getBoundingClientRect(),em=['💖','✨','🌸','💕','⭐'],n=8;for(let z=0;z<n;z++){const s=document.createElement('span'),a=Math.PI*2*z/n,d=40+Math.random()*40;s.className='bu';s.textContent=em[z%5];s.style.cssText=`left:${r.left+r.width/2}px;top:${r.top+r.height/2}px;--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d-30}px`;document.body.appendChild(s);setTimeout(()=>s.remove(),900)}}
function celebrate(){const em=['🎀','💖','✨','🌸','🦋','🎉'];for(let z=0;z<28;z++){const s=document.createElement('span');s.className='cf';s.textContent=em[z%6];s.style.cssText=`left:${Math.random()*100}vw;animation-delay:${Math.random()*.6}s;font-size:${18+Math.random()*16}px`;document.body.appendChild(s);setTimeout(()=>s.remove(),3300)}}
const FX=['🌸','💖','✨','🦋','🎀','💕','🌷'];for(let z=0;z<14;z++){const s=document.createElement('span');s.textContent=FX[z%7];s.style.cssText=`left:${(z*7.3+Math.random()*5)%100}%;font-size:${14+Math.random()*14}px;animation-duration:${14+Math.random()*12}s;animation-delay:-${Math.random()*20}s`;$('fx').appendChild(s)}
$('td').onclick=()=>{sel=td;mon=ym(plan[td].d);render();$('panel').scrollIntoView({behavior:'smooth',block:'start'})};
render();
</script></body></html>
